name: Windows verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Backend regression and integration tests
        working-directory: backend
        run: mvn -B package
      - name: Install frontend and Electron test dependencies
        run: npm.cmd ci
      - name: Typecheck and build renderer
        run: npm.cmd run build
      - name: Build and verify native Windows receipt sharing
        run: |
          npm.cmd run build:share
          npm.cmd run test:share
          node scripts/share-smoke.cjs --png
          node scripts/share-session-test.cjs
      - name: API and restart verification
        run: npm.cmd run test:api
      - name: Electron catalog, billing, controls and Stage 6 acceptance
        run: npm.cmd run test:desktop
      - name: Prepare verified bundled runtime
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-runtime.ps1
      - name: Build packaged Windows evaluation application
        run: npm.cmd run package:dir
      - name: Verify packaged app with bundled Java and restart persistence
        run: npm.cmd run test:packaged
      - name: Record package hashes and signature status
        run: npm.cmd run release:check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage6-verification
          path: |
            backend/target/surefire-reports/*.xml
            docs/screenshots/stage6-*.png
            docs/runtime-manifest.json
            release/release-manifest.json
