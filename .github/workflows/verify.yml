name: Windows verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Backend regression and integration tests
        working-directory: backend
        run: mvn -B package
      - name: Install frontend and Electron test dependencies
        run: npm.cmd ci
      - name: Typecheck and build renderer
        run: npm.cmd run build
      - name: API and restart verification
        run: npm.cmd run test:api
      - name: Electron import, stock and labels acceptance
        run: npm.cmd run test:desktop
